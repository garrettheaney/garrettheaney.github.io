<style>
  :root {
    --bg: #000000;
    --rule: #6fe3ff;
    --ink: #ffffff;
    --pale: #000000;
    --gator: #3ddc5a;
    --display: "Archivo Black", Impact, "Arial Black", "Helvetica Neue", Arial, sans-serif;
    --text: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --pad: clamp(1rem, 4vw, 3rem);
    --line: 2px;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--text);
    font-size: clamp(1.05rem, 1.4vw, 1.3rem);
    font-weight: 500;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 90rem; margin: 0 auto; background: var(--bg); border-left: var(--line) solid var(--rule); border-right: var(--line) solid var(--rule); }
  a { color: inherit; }
  a:focus-visible { outline: 6px solid var(--rule); outline-offset: -6px; }
  .skip { position: absolute; left: -999px; }
  .skip:focus { left: 1rem; top: 1rem; background: var(--ink); color: var(--pale); padding: .5rem 1rem; z-index: 5; }

  /* hero */
  header { padding: var(--pad); border-bottom: var(--line) solid var(--rule); position: relative; }
  .gator { position: absolute; top: var(--pad); right: var(--pad); width: clamp(9rem, 32vw, 28rem); height: auto; color: var(--gator); }
  .top {
    font-family: var(--display); font-weight: 900; font-synthesis: none;
    font-size: clamp(1rem, 2.2vw, 1.8rem);
    text-transform: uppercase; line-height: 1.05;
    margin: 0 0 clamp(5rem, 14vw, 12rem);
    max-width: 55%;
  }
  h1 {
    font-family: var(--display); font-weight: 900; font-synthesis: none;
    font-size: clamp(3rem, 18.5vw, 19rem);
    line-height: 0.8;
    letter-spacing: -0.045em;
    text-transform: uppercase;
    margin: 0;
  }

  .jaw { transform-origin: 150px 100px; animation: chomp 3.4s ease-in-out infinite; }
  @keyframes chomp {
    0%, 52%, 100% { transform: rotate(0deg); }
    8%  { transform: rotate(-17deg); }
    16% { transform: rotate(0deg); }
    24% { transform: rotate(-17deg); }
    32% { transform: rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce) { .jaw { animation: none; } }

  /* link rows */
  nav { border-bottom: var(--line) solid var(--rule); }
  nav ul { list-style: none; margin: 0; padding: 0; }
  nav li + li { border-top: 1px solid var(--rule); }
  nav a {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 0.5rem 2rem;
    padding: clamp(1rem, 2.5vw, 2rem) var(--pad);
    text-decoration: none;
  }
  nav a:hover, nav a:focus-visible { background: var(--ink); color: var(--pale); }
  .name {
    font-family: var(--display); font-weight: 900; font-synthesis: none;
    font-size: clamp(3.2rem, 15vw, 14rem);
    line-height: 0.85;
    letter-spacing: -0.04em;
    text-transform: uppercase;
  }
  .what {
    font-weight: 800;
    text-align: right;
    max-width: 16rem;
    padding-bottom: 0.5rem;
  }
  .what::after { content: ""; display: block; width: 1.4rem; height: 1.4rem; background: var(--rule); margin: 0.6rem 0 0 auto; }

  /* contact */
  .contact { padding: var(--pad); background: var(--ink); color: var(--bg); border-bottom: var(--line) solid var(--rule); }
  .contact h2 {
    font-family: var(--display); font-weight: 900; font-synthesis: none;
    font-size: clamp(2rem, 6vw, 5rem); text-transform: uppercase; line-height: 0.9; letter-spacing: -0.03em;
    margin: 0 0 1rem;
  }
  .mail {
    display: inline-block;
    font-family: var(--display); font-weight: 900; font-synthesis: none;
    font-size: clamp(1.3rem, 5.2vw, 4.5rem);
    line-height: 1.05; letter-spacing: -0.03em;
    overflow-wrap: anywhere;
    text-decoration-thickness: 2px; text-underline-offset: 6px;
  }
  .mail:hover { background: var(--bg); color: var(--ink); text-decoration: none; }
  .phone { font-family: var(--display); font-weight: 900; font-synthesis: none; font-size: clamp(1.3rem, 3vw, 2.4rem); margin: 1rem 0 0; }
  .phone a { text-decoration-thickness: 2px; text-underline-offset: 5px; }
  .phone a:hover { background: var(--bg); color: var(--ink); text-decoration: none; }

  footer {
    padding: var(--pad);
    font-family: var(--display); font-weight: 900; font-synthesis: none;
    text-transform: uppercase; font-size: clamp(0.9rem, 1.6vw, 1.3rem);
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem 2rem;
  }

  @media (max-width: 40rem) {
    .top { max-width: 100%; margin-top: 7rem; margin-bottom: 3rem; }
    nav a { grid-template-columns: 1fr; }
    .what { text-align: left; max-width: none; }
    .what::after { margin-left: 0; }
  }
</style>
</head>
